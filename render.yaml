services:
  - type: web
    name: instabot2
    env: python
    plan: free # Free: no disk, no SSH, spins down after 15m - UptimeRobot required
    region: singapore # closest to IN, change to oregon if US
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600 --graceful-timeout 60 --keep-alive 5 --log-level info
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SESSION_JSON
        sync: false # paste full session.json content here (Render Dashboard -> Environment)
      - key: TARGET_USERNAME
        sync: false # null in config.json = your feed, or e.g. "instagram"
      - key: UPLOAD_SECRET
        sync: false
        # generateValue: true  # uncomment to auto-generate
      - key: SCRAPE_AMOUNT
        value: "10"
      - key: EXTRA_CAPTION
        value: "Follow for more 🔥"
      # Free-tier dedup: uses /tmp + profile marker, no disk needed
      # For paid, add disk and set STORE_PATH=/data/dedup.json + upgrade plan to starter
